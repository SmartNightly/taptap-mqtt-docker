name: Build and publish container image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths-ignore:
      - '**.md'
      - 'integrations/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'integrations/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      taptap_version:
        description: 'taptap release tag (litinoveweedle/taptap)'
        default: 'v0.2.6'
        required: true
      taptap_mqtt_version:
        description: 'taptap-mqtt release tag (litinoveweedle/taptap-mqtt)'
        default: 'v0.2.6'
        required: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/taptap-mqtt
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
  TAPTAP_VERSION: ${{ inputs.taptap_version || 'v0.2.6' }}
  TAPTAP_MQTT_VERSION: ${{ inputs.taptap_mqtt_version || 'v0.2.6' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build (multi-arch) and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU (arm emulation for cross builds)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Smoke test on the native platform before anything is pushed:
      # the taptap binary must run, and taptap-mqtt must start and reject a missing config cleanly.
      - name: Build amd64 for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: taptap-mqtt:smoke
          build-args: |
            TAPTAP_VERSION=${{ env.TAPTAP_VERSION }}
            TAPTAP_MQTT_VERSION=${{ env.TAPTAP_MQTT_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -eux
          docker run --rm --entrypoint taptap taptap-mqtt:smoke --version
          # No config mounted → taptap-mqtt must exit 1 with a config error, not crash otherwise.
          set +e
          out=$(docker run --rm taptap-mqtt:smoke 2>&1); rc=$?
          set -e
          echo "$out"
          test "$rc" -eq 1
          echo "$out" | grep -qi "config"
          docker run --rm --entrypoint id taptap-mqtt:smoke | grep -q 'uid=1000(taptap)'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
          labels: |
            org.opencontainers.image.title=taptap-mqtt
            org.opencontainers.image.description=Tigo TAP/CCA optimizer data to MQTT (taptap ${{ env.TAPTAP_VERSION }} + taptap-mqtt ${{ env.TAPTAP_MQTT_VERSION }})

      - name: Build and push (${{ env.PLATFORMS }})
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TAPTAP_VERSION=${{ env.TAPTAP_VERSION }}
            TAPTAP_MQTT_VERSION=${{ env.TAPTAP_MQTT_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Show published manifest
        if: github.event_name != 'pull_request'
        run: |
          first=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker buildx imagetools inspect "$first"
